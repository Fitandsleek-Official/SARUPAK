# Local infrastructure for SARUPAK Phase 1+
# Requires Docker Desktop running: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: sarupak-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: sarupak
      POSTGRES_PASSWORD: sarupak
      POSTGRES_DB: sarupak
    volumes:
      - sarupak_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarupak -d sarupak"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sarupak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sarupak_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: sarupak-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: sarupak
      MINIO_ROOT_PASSWORD: sarupaksecret
    volumes:
      - sarupak_minio:/data

volumes:
  sarupak_pg:
  sarupak_redis:
  sarupak_minio:
